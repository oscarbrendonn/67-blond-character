<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>67 Character — 6 versions</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{ --bg:#0e1116; --panel:#161b22; --txt:#e6edf3; --accute:#2f81f7; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header{ padding:14px 18px; text-align:center; }
  header h1{ margin:0; font-size:18px; font-weight:650; letter-spacing:.2px; }
  header p{ margin:4px 0 0; font-size:13px; opacity:.65; }
  .wrap{ height:calc(100% - 64px); display:flex; flex-direction:column; }
  model-viewer{ flex:1; width:100%; background:
    radial-gradient(120% 90% at 50% 0%, #1c2230 0%, #0e1116 70%); }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:14px;
    background:var(--panel); border-top:1px solid #21262d; }
  .grp{ display:flex; gap:8px; align-items:center; }
  .grp .lbl{ font-size:12px; opacity:.55; margin-right:2px; }
  .sep{ width:1px; align-self:stretch; background:#30363d; margin:2px 6px; }
  button{ padding:9px 16px; font-size:14px; }
  button{ appearance:none; border:1px solid #30363d; background:#1b2230; color:var(--txt);
    padding:10px 20px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer;
    transition:.15s; }
  button:hover{ border-color:#3d4854; }
  button.active{ background:var(--accute); border-color:var(--accute); color:#fff; }
  .hint{ position:absolute; bottom:78px; width:100%; text-align:center; font-size:12px;
    opacity:.5; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>67 Character — 6 versions</h1>
  <p>Wavy ×3 + Curly ×11 · drag to rotate · scroll to zoom</p>
</header>
<div class="wrap">
  <model-viewer id="mv" src="v1.glb" alt="67 blond character"
    camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="18deg"
    shadow-intensity="0.9" exposure="1.05" environment-image="neutral"
    camera-orbit="0deg 85deg 2.4m" min-camera-orbit="auto 0deg auto" touch-action="pan-y">
  </model-viewer>
  <div class="hint">Pick a version below</div>
  <div class="bar">
    <div class="grp"><span class="lbl">Wavy</span>
      <button data-src="v1.glb" class="active">1</button>
      <button data-src="v2.glb">2</button>
      <button data-src="v3.glb">3</button>
    </div>
    <div class="sep"></div>
    <div class="grp"><span class="lbl">Curly</span>
      <button data-src="v7.glb">1</button>
      <button data-src="v8.glb">2</button>
      <button data-src="v9.glb">3</button>
      <button data-src="v10.glb">4</button>
      <button data-src="v11.glb">5</button>
      <button data-src="v12.glb">6</button>
      <button data-src="v13.glb">7</button>
      <button data-src="v14.glb">8</button>
      <button data-src="v15.glb">9</button>
      <button data-src="v16.glb">10</button>
      <button data-src="v17.glb">11</button>
    </div>
  </div>
</div>
<script>
  const mv = document.getElementById('mv');
  document.querySelectorAll('.bar button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      mv.setAttribute('src', b.dataset.src);
    });
  });
</script>
</body>
</html>
